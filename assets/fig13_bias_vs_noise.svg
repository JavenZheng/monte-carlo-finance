<rect x="724.2" y="316.1" width="31.2" height="0.7" fill="#c2410c" opacity="0.95"/>
<line x1="728.8" y1="316.1" x2="750.8" y2="316.1" stroke="#c2410c" stroke-width="3"/>
<text x="485.5" y="116.3" font-size="11.5" fill="#2f6fb0" text-anchor="middle">-0.723</text>
<text x="485.5" y="342.0" font-size="11.5" fill="#454545" text-anchor="middle">切 1 段</text>
<text x="530.1" y="209.7" font-size="11.5" fill="#2f6fb0" text-anchor="middle">-0.363</text>
<text x="530.1" y="342.0" font-size="11.5" fill="#454545" text-anchor="middle">切 2 段</text>
<text x="574.7" y="259.2" font-size="11.5" fill="#2f6fb0" text-anchor="middle">-0.172</text>
<text x="574.7" y="342.0" font-size="11.5" fill="#454545" text-anchor="middle">切 4 段</text>
<text x="619.3" y="284.7" font-size="11.5" fill="#2f6fb0" text-anchor="middle">-0.073</text>
<text x="619.3" y="342.0" font-size="11.5" fill="#454545" text-anchor="middle">切 8 段</text>
<text x="664.0" y="297.7" font-size="11.5" fill="#2f6fb0" text-anchor="middle">-0.023</text>
<text x="664.0" y="342.0" font-size="11.5" fill="#454545" text-anchor="middle">切 16 段</text>
<text x="739.8" y="342.0" font-size="11.5" fill="#c2410c" text-anchor="middle">加回 x²/2</text>
<text x="739.8" y="308.1" font-size="11.5" fill="#c2410c" text-anchor="middle">-0.003</text>
<text x="452.0" y="96.0" font-size="13" fill="#3a3a3a" text-anchor="start">② 只切段：偏差每次减半，减不到零</text>
<text x="26.0" y="372.0" font-size="12.5" fill="#454545" text-anchor="start">左：毛边按 √次数 缩——2,000 遍 ±0.41，二十万遍只剩 ±0.04；橙线那 0.72（=0.12²/2 × 本金）与次数无关，加十倍算力它一步不让。</text>
<text x="26.0" y="396.0" font-size="12.5" fill="#454545" text-anchor="start">右：把 30 天切成段，段数翻倍、偏差减半（-0.723 → -0.023），这是一阶的，永远在路上下。</text>
<text x="26.0" y="420.0" font-size="12.5" fill="#454545" text-anchor="start">而把扔掉的那一项加回去（1 + x + x²/2），一次就从 0.723 掉到 0.003——一次修正顶得上切一百段。</text>
<text x="26.0" y="446.0" font-size="12" fill="#7a7a7a" text-anchor="start">这就是原书把第 4 章（方差缩减）和第 6 章（离散化）分成两章的原因：一笔治毛边，一笔治偏差，两笔不能互抵。</text>
</svg>