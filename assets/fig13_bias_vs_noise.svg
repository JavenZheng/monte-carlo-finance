<text x="67.2" y="301.6" font-size="12.5" fill="#c2410c" text-anchor="start">偷懒一步算：112.00</text>
<line x1="377.0" y1="194.6" x2="377.0" y2="284.6" stroke="#c2410c" stroke-width="1.6"/>
