<text x="58.0" y="378.0" font-size="12.5" fill="#454545" text-anchor="start">左：组间占 69.6%——把天气定下来，整月起伏从 60.2 掉到 33.2 单（模拟实测 59.7 → 34.8，少 41.7%）。</text>
<text x="58.0" y="400.0" font-size="12.5" fill="#454545" text-anchor="start">右：辅助量能省多少看的是相关的平方——ρ=0.3 只降 4.5%，ρ=0.9 才降 56.4%。</text>
<text x="58.0" y="422.0" font-size="12.5" fill="#c2410c" text-anchor="start">所以：能查清楚的先查清楚（那是组间，不花算力）；要找帮手，就找几乎同涨同跌的那个，不然白干。</text>
