<text x="419.0" y="460" font-size="12.5" fill="#454545" text-anchor="middle">篮子里有几只（等权）</text>
<text x="16" y="201.0" font-size="12.5" fill="#454545" text-anchor="middle" transform="rotate(-90 16 201.0)">篮子起伏 ÷ 单只起伏</text>
<text x="64.0" y="380.0" font-size="12.5" fill="#454545" text-anchor="start">相关 0.3 这一格：1 只 1.000 → 10 只 0.608 → 100 只 0.554，而地板是 0.548——加到第一百只，只比第十只少了 9%。</text>
<text x="64.0" y="400.0" font-size="12.5" fill="#c2410c" text-anchor="start">换成每天 2% 的单只起伏：1 只 2.00% → 10 只 1.22% → 100 只 1.11%，再怎么加也到不了 1.10% 以下。</text>
<text x="64.0" y="420.0" font-size="12" fill="#7a7a7a" text-anchor="start">地板是那个共同的"大环境"给的：你能摊掉的是各自的小运气，摊不掉一起动的那一份。</text>
