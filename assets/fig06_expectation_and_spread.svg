<line x1="261.2" y1="100.0" x2="261.2" y2="362.0" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="253.2" y="118.0" font-size="12.5" fill="#b91c1c" text-anchor="end">每月固定支出 9,000</text>
<text x="58.0" y="434.0" font-size="12.5" fill="#454545" text-anchor="start">橙线是"掺很多遍之后每次摊到的数"，它常常不在任何一个可能的月份上：B 的期望 12000 那一格，一个月都不会出现。</text>
<text x="58.0" y="454.0" font-size="12.5" fill="#454545" text-anchor="start">A 和 B 的橙线落在同一条竖线上，脾气一个 ±0、一个 ±3674。期望相同，人生不同——这就是第二个数存在的理由。</text>
<text x="58.0" y="474.0" font-size="12.5" fill="#b91c1c" text-anchor="start">红虚线才是生活：固定支出 9000。B 有四成的月份落在它左边，C 有一半。期望看不见这件事。</text>
</svg>