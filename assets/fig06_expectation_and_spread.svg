<text x="26" y="30" font-size="19" font-weight="600" fill="#1a1a1a">三份 offer：期望一样，脾气不一样，落到你身上更不一样</text>
<text x="26" y="50" font-size="12.5" fill="#7a7a7a">圆是可能的结果，圆越大代表那种月份越常；橙实线＝掺出来的期望，灰括号＝脾气（离期望一般多远）</text>
