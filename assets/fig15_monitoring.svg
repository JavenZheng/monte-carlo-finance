<text x="58.0" y="378.0" font-size="12.5" fill="#454545" text-anchor="start">黑虚线＝每段都看（1000 次）算出的真值 60.5%；灰点线＝连续地看的理论值 61.7%</text>
<text x="58.0" y="398.0" font-size="12.5" fill="#454545" text-anchor="start">连每段都看都比理论值低 1.2 个百分点：这条路你不可能看全，只能选择漏多少。</text>
<text x="58.0" y="418.0" font-size="12.5" fill="#c2410c" text-anchor="start">第 14 课那份保底合同"看 12 次报 6.82、看 500 次报 6.13"，差的就是这里漏掉的跌破折成的钱。</text>
<text x="16" y="194.0" font-size="12.5" fill="#454545" text-anchor="middle" transform="rotate(-90 16 194.0)">跌破过的路径占几成</text>
